<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AL RIWAYAH — Replacement hero concepts</title>
    <style>
      :root {
        --paper: #f3ecdf;
        --paper-2: #e8decd;
        --ink: #1a1915;
        --muted: #71695d;
        --line: rgba(26, 25, 21, 0.2);
        --green: #315f55;
        --coral: #c94f45;
        --amber: #ae792f;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        font-family: "IBM Plex Sans Arabic", "Noto Sans Arabic", Arial, sans-serif;
      }

      * { box-sizing: border-box; }
      body {
        min-width: 320px;
        margin: 0;
        background:
          linear-gradient(rgba(26, 25, 21, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(26, 25, 21, 0.04) 1px, transparent 1px),
          var(--paper);
        background-size: 64px 64px;
        color: var(--ink);
      }

      .nav {
        display: flex;
        min-height: 80px;
        align-items: center;
        justify-content: space-between;
        padding-inline: clamp(18px, 4vw, 64px);
        border-bottom: 1px solid var(--line);
      }

      .brand { font-size: 1.25rem; font-weight: 700; }
      .concept-tag {
        padding: 6px 10px 8px;
        border: 1px solid var(--line);
        color: var(--muted);
        font-size: .78rem;
      }

      .hero {
        display: grid;
        min-height: calc(100svh - 80px);
        grid-template-columns: minmax(360px, .82fr) minmax(580px, 1.18fr);
        gap: clamp(38px, 6vw, 96px);
        align-items: center;
        padding: clamp(52px, 8vw, 120px) clamp(18px, 4vw, 64px);
      }

      .copy { max-width: 610px; }
      .kicker { color: var(--muted); font-size: .9rem; }
      h1 {
        max-width: 10ch;
        margin: 22px 0;
        font-size: clamp(3.2rem, 5vw, 5.1rem);
        line-height: 1.12;
      }
      .lede { max-width: 37ch; color: var(--muted); font-size: 1.15rem; line-height: 1.75; }
      .actions { display: flex; gap: 10px; margin-top: 34px; }
      .button {
        min-height: 52px;
        padding: 13px 22px;
        border: 1px solid var(--ink);
        background: transparent;
        font-weight: 700;
      }
      .button.primary { background: var(--ink); color: var(--paper); }

      .visual { position: relative; min-height: 600px; direction: rtl; }
      .mono { direction: ltr; font-family: Consolas, monospace; }

      /* 01 — Live testimony editor */
      .editor {
        position: absolute;
        inset: 5% 0;
        overflow: hidden;
        border: 1px solid var(--ink);
        background: #fbf5ea;
        box-shadow: 14px 16px 0 var(--ink);
      }
      .editor__bar {
        display: flex;
        min-height: 58px;
        align-items: center;
        justify-content: space-between;
        padding-inline: 22px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: .78rem;
      }
      .editor__body { padding: clamp(34px, 5vw, 72px); }
      .editor__line {
        position: relative;
        margin: 0;
        font-size: clamp(1.65rem, 3vw, 3.4rem);
        font-weight: 650;
        line-height: 1.75;
      }
      .editor__line mark {
        background: rgba(174, 121, 47, .22);
        color: inherit;
      }
      .editor__removed {
        position: relative;
        color: var(--coral);
      }
      .editor__removed::after {
        position: absolute;
        inset: 54% -4px auto;
        height: 2px;
        background: currentColor;
        content: "";
      }
      .editor__insert {
        display: inline-block;
        padding-inline: 7px;
        border-bottom: 3px solid var(--green);
        color: var(--green);
        transform: rotate(-1deg);
      }
      .editor__rule {
        margin-top: 48px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
        color: var(--coral);
      }
      .cursor {
        position: absolute;
        display: grid;
        grid-template-columns: 1px auto;
        gap: 6px;
        align-items: start;
        color: var(--ink);
        font-size: .74rem;
        animation: cursor-in 700ms var(--ease) both;
      }
      .cursor::before { width: 1px; height: 28px; background: currentColor; content: ""; }
      .cursor i { width: 9px; height: 9px; margin-top: 3px; background: currentColor; }
      .cursor.c1 { inset: 19% 8% auto auto; color: var(--green); }
      .cursor.c2 { inset: 38% auto auto 11%; color: var(--coral); animation-delay: 100ms; }
      .cursor.c3 { inset: auto 26% 18% auto; color: var(--amber); animation-delay: 200ms; }
      .editor-note {
        position: absolute;
        inset: auto auto 1% 7%;
        padding: 10px 14px;
        background: var(--coral);
        color: #fffaf0;
        transform: rotate(2deg);
      }

      /* 02 — Contradiction timeline */
      .timeline {
        position: absolute;
        inset: 4% 0;
        overflow: hidden;
        border-block: 1px solid var(--ink);
        background: rgba(255, 250, 240, .68);
      }
      .timeline__ruler {
        display: grid;
        min-height: 64px;
        grid-template-columns: repeat(5, 1fr);
        align-items: end;
        border-bottom: 1px solid var(--line);
        direction: ltr;
      }
      .timeline__ruler span {
        padding: 10px 12px;
        border-left: 1px solid var(--line);
        color: var(--muted);
        font: .72rem Consolas, monospace;
      }
      .tracks { padding: 24px 0 28px; }
      .track {
        position: relative;
        display: grid;
        min-height: 70px;
        grid-template-columns: 110px 1fr;
        align-items: center;
        border-bottom: 1px solid var(--line);
        animation: track-in 620ms var(--ease) both;
      }
      .track:nth-child(2) { animation-delay: 70ms; }
      .track:nth-child(3) { animation-delay: 140ms; }
      .track:nth-child(4) { animation-delay: 210ms; }
      .track:nth-child(5) { animation-delay: 280ms; }
      .track:nth-child(6) { animation-delay: 350ms; }
      .track__name { padding-inline: 18px; color: var(--muted); font-size: .82rem; }
      .track__claim {
        position: absolute;
        inset-inline-start: var(--at);
        width: var(--w);
        min-height: 38px;
        padding: 7px 12px 9px;
        border: 1px solid var(--ink);
        background: var(--paper-2);
        white-space: nowrap;
      }
      .track.is-break .track__claim {
        border-color: var(--coral);
        background: var(--coral);
        color: #fffaf0;
      }
      .timeline__needle {
        position: absolute;
        inset: 64px auto 0 59%;
        width: 2px;
        background: var(--coral);
        transform-origin: top;
        animation: needle 900ms 360ms var(--ease) both;
      }
      .timeline__needle span {
        position: absolute;
        inset: 22px auto auto 8px;
        width: max-content;
        padding: 7px 10px;
        background: var(--ink);
        color: var(--paper);
        font-size: .74rem;
      }

      /* 03 — Phone statement relay */
      .relay { position: absolute; inset: 2% 0; perspective: 1100px; }
      .phone {
        position: absolute;
        width: min(42%, 300px);
        aspect-ratio: .57;
        overflow: hidden;
        border: 1px solid var(--ink);
        background: #fbf5ea;
        box-shadow: 10px 12px 0 rgba(26, 25, 21, .9);
        transform: translate(var(--x), var(--y)) rotate(var(--r));
        transition: transform 500ms var(--ease);
      }
      .phone:nth-child(1) { --x: 2%; --y: 14%; --r: -7deg; z-index: 1; }
      .phone:nth-child(2) { --x: 68%; --y: 4%; --r: 6deg; z-index: 2; }
      .phone:nth-child(3) { --x: 118%; --y: 19%; --r: 9deg; z-index: 1; }
      .phone.is-front { --x: 58%; --y: 3%; --r: -1deg; z-index: 4; background: var(--green); color: #fffaf0; }
      .phone__top {
        display: flex;
        min-height: 48px;
        align-items: center;
        justify-content: space-between;
        padding-inline: 16px;
        border-bottom: 1px solid currentColor;
        font-size: .72rem;
        opacity: .72;
      }
      .phone__body { padding: 28px 20px; }
      .phone__body h3 { margin: 0 0 22px; font-size: 1.45rem; line-height: 1.45; }
      .choice { display: block; margin-top: 9px; padding: 10px; border: 1px solid currentColor; }
      .phone.is-front .choice.is-on { background: #fffaf0; color: var(--ink); }
      .relay__path {
        position: absolute;
        inset: auto 8% 7%;
        height: 2px;
        background: var(--coral);
        transform: rotate(-4deg) scaleX(.82);
      }
      .relay__path::after {
        position: absolute;
        inset: -5px auto auto 41%;
        width: 12px;
        height: 12px;
        background: var(--amber);
        content: "";
        transform: rotate(45deg);
      }
      .relay__caption {
        position: absolute;
        inset: auto 18% 0 auto;
        padding: 8px 12px;
        background: var(--ink);
        color: var(--paper);
        font-size: .78rem;
      }

      @keyframes cursor-in { from { opacity: 0; transform: translateY(14px); } }
      @keyframes track-in { from { opacity: 0; transform: translateX(20px); } }
      @keyframes needle { from { transform: scaleY(0); } }

      @media (max-width: 900px) {
        .hero {
          min-height: auto;
          grid-template-columns: 1fr;
          padding-block: 52px;
        }
        .copy { max-width: none; }
        h1 { max-width: 11ch; font-size: clamp(2.55rem, 10.5vw, 4rem); }
        .visual { min-height: 480px; }
      }

      @media (max-width: 520px) {
        .nav { min-height: 68px; }
        .hero { padding: 36px 16px 44px; gap: 42px; }
        h1 { margin-block: 16px; font-size: 2.7rem; }
        .lede { font-size: 1rem; }
        .actions { flex-direction: column; }
        .visual { min-height: 430px; }
        .editor { inset-block: 0 6%; box-shadow: 8px 9px 0 var(--ink); }
        .editor__body { padding: 38px 22px; }
        .editor__line { font-size: 1.55rem; }
        .cursor.c2 { display: none; }
        .timeline { inset-block: 0; }
        .timeline__ruler span:nth-child(even) { display: none; }
        .timeline__ruler { grid-template-columns: repeat(3, 1fr); }
        .track { min-height: 55px; grid-template-columns: 74px 1fr; }
        .track__name { padding-inline: 9px; font-size: .7rem; }
        .track__claim { min-height: 34px; padding: 6px 8px; font-size: .72rem; }
        .timeline__needle { left: 58%; }
        .phone { width: 53%; }
        .phone:nth-child(1) { --x: -6%; --y: 16%; }
        .phone:nth-child(2) { --x: 68%; --y: 5%; }
        .phone:nth-child(3) { --x: 102%; --y: 24%; }
        .phone.is-front { --x: 45%; --y: 2%; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <header class="nav">
      <strong class="brand">الرواية</strong>
      <span class="concept-tag" id="tag"></span>
    </header>
    <main class="hero">
      <div class="copy">
        <p class="kicker">لعبة تحقيق اجتماعية · ٤–٦ أشخاص</p>
        <h1>كل رواية تتغيّر مع كل شهادة.</h1>
        <p class="lede">اتفقوا على رواية واحدة، جاوبوا كل واحد لحاله، ثم واجهوا اللحظة اللي ما عاد تركب فيها التفاصيل.</p>
        <div class="actions">
          <button class="button primary">ابدأ جلسة</button>
          <button class="button">عندي رمز</button>
        </div>
      </div>
      <div class="visual" id="visual"></div>
    </main>
    <script>
      const concept = new URLSearchParams(location.search).get("concept") || "editor";
      const tag = document.querySelector("#tag");
      const visual = document.querySelector("#visual");

      const templates = {
        editor: `
          <div class="editor">
            <div class="editor__bar"><span>الإفادة المشتركة / تحرير حي</span><span class="mono">REV. 06</span></div>
            <div class="editor__body">
              <p class="editor__line">كنا كلنا في <mark>المجلس</mark> عندما <span class="editor__removed">انطفأت الأنوار</span> <span class="editor__insert">وصلت الرسالة</span>.</p>
              <p class="editor__rule">لا يمكن أن تكون النسختان صحيحتين في اللحظة نفسها.</p>
            </div>
            <span class="cursor c1"><i></i>نورة تكتب</span>
            <span class="cursor c2"><i></i>راكان عدّل</span>
            <span class="cursor c3"><i></i>أنت هنا</span>
          </div>
          <span class="editor-note">ظهرت نسخة جديدة من الرواية</span>`,
        timeline: `
          <div class="timeline">
            <div class="timeline__ruler"><span>23:40</span><span>23:45</span><span>23:48</span><span>23:55</span><span>00:01</span></div>
            <div class="tracks">
              <div class="track"><span class="track__name">نورة</span><span class="track__claim" style="--at:13%;--w:34%">في المجلس</span></div>
              <div class="track"><span class="track__name">راكان</span><span class="track__claim" style="--at:25%;--w:31%">مع فهد</span></div>
              <div class="track is-break"><span class="track__name">سارة</span><span class="track__claim" style="--at:48%;--w:29%">في المستودع</span></div>
              <div class="track"><span class="track__name">فهد</span><span class="track__claim" style="--at:19%;--w:37%">لم أترك المجلس</span></div>
              <div class="track is-break"><span class="track__name">ليان</span><span class="track__claim" style="--at:52%;--w:32%">رأيت فهد وحده</span></div>
              <div class="track"><span class="track__name">أنت</span><span class="track__claim" style="--at:30%;--w:30%">انطفأت الأنوار</span></div>
            </div>
            <div class="timeline__needle"><span>23:48 · هنا انفصلت الرواية</span></div>
          </div>`,
        relay: `
          <div class="relay">
            <article class="phone"><div class="phone__top"><span>نورة</span><span>08 / 19</span></div><div class="phone__body"><h3>وين كنت وقت انطفأت الأنوار؟</h3><span class="choice">المجلس</span><span class="choice">المستودع</span></div></article>
            <article class="phone is-front"><div class="phone__top"><span>أنت</span><span>دورك</span></div><div class="phone__body"><h3>مين كان معك وقتها؟</h3><span class="choice is-on">فهد</span><span class="choice">كنت لحالي</span></div></article>
            <article class="phone"><div class="phone__top"><span>ليان</span><span>أجابت</span></div><div class="phone__body"><h3>هل غادرتِ المجلس؟</h3><span class="choice">لا</span><span class="choice">نعم</span></div></article>
            <div class="relay__path"></div>
            <span class="relay__caption">٦ شاشات · قرار واحد يكشف الفرق</span>
          </div>`
      };
      const labels = {
        editor: "01 / محرّر الإفادات",
        timeline: "02 / خطّ التناقض",
        relay: "03 / تمرير الرواية"
      };
      tag.textContent = labels[concept];
      visual.innerHTML = templates[concept];
    </script>
  </body>
</html>
